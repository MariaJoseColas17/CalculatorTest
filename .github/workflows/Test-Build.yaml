name: Test-Build

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  Test-Build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"
    - name: Install dependencies
      run: pip install -r requirements.txt
    - name: Test with pytest
      run:  pytest test.py
